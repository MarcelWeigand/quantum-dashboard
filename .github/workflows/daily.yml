name: Weekly data update

on:
  schedule:
    # 01:00 UTC Saturday = Friday evening US time, after the market close. Runs just before
    # weekly.yml (02:00 UTC), so the weekly summary sees this week's fresh headlines.
    - cron: "0 1 * * 6"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: quantum-dashboard-data # shared with weekly.yml so the two never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch data and write docs/data
        run: python scripts/fetch_data.py
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "quantum-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly data update $(date -u +%F)"
            git push
          fi
