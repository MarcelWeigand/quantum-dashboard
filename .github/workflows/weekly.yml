name: Weekly market summary

# 02:00 UTC Saturday = Friday 22:00 ET (EDT, summer) or Friday 21:00 ET (EST, winter) —
# a fixed UTC cron can't shift with US daylight saving, but both land safely after the
# 4pm ET market close, so it always runs Friday night US time.
on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: quantum-dashboard-data # shared with daily.yml so the two never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build the weekly summary
        run: python scripts/fetch_data.py --weekly
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "quantum-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly market summary $(date -u +%F)"
            git push
          fi
